const scoringAdjustments = {
    standard: { RB: 1, WR: 1, TE: 1 },
    half: { RB: 1.025, WR: 1.04, TE: 1.05 },
    ppr: { RB: 1.05, WR: 1.08, TE: 1.1 }
};
const numberFormat = new Intl.NumberFormat();
const positionOrder = ["QB", "RB", "WR", "TE"];
const rankingSnapshot = window.fantasyRankingSnapshot;
let activePlayers = [];
let playerInputCounter = 0;

function playerValue(name) {
    if (!name) return 0;
    const player = activePlayers.find(item => item.name === name);
    return player ? player.value : (getSelectedPlayerPosition(name) ? 25 : 0);
}

function buildActivePlayers() {
    const mode = document.getElementById("rankingMode").value;
    const scoring = document.getElementById("scoring").value;
    const superflex = document.getElementById("superflex").checked;
    const playersByValue = positionOrder.flatMap(position => {
        const multiplierInput = document.getElementById(position.toLowerCase() + "Multiplier");
        const rawMultiplier = Number(multiplierInput.value);
        const positionMultiplier = Math.min(1.5, Math.max(.25, Number.isFinite(rawMultiplier) ? rawMultiplier : 1));
        const scoringAdjustment = scoringAdjustments[scoring][position] || 1;
        const superflexAdjustment = superflex && position === "QB" ? 1.25 : 1;

        const baseValues = rankingSnapshot.values?.[mode]?.[position]?.split("|").map(Number);

        return rankingSnapshot.lists[mode][position].split("|").map((name, index) => ({
            name,
            position,
            positionRank: index + 1,
            value: Math.round((baseValues?.[index] || Math.max(100, 1000 - index * 9)) * positionMultiplier * scoringAdjustment * superflexAdjustment)
        }));
    });

    return playersByValue
        .sort((first, second) => second.value - first.value || first.positionRank - second.positionRank)
        .map((player, index) => ({ ...player, overallRank: index + 1 }));
}

function getSelectedPlayerPosition(name) {
    const mode = document.getElementById("rankingMode").value;
    const otherMode = mode === "redraft" ? "dynasty" : "redraft";
    return positionOrder.find(position =>
        rankingSnapshot.lists[mode][position].split("|").includes(name) ||
        rankingSnapshot.lists[otherMode][position].split("|").includes(name)
    ) || players.find(player => player.name === name)?.position;
}

function populatePlayerSelect(input, results, showResults = false) {
    const searchText = input.value.trim().toLowerCase();
    const selectedElsewhere = new Set(Array.from(document.querySelectorAll(".asset input.player-select"))
        .filter(otherInput => otherInput !== input)
        .map(otherInput => otherInput.value)
        .filter(name => activePlayers.some(player => player.name === name)));
    const matches = activePlayers.filter(player =>
        (!searchText || player.name.toLowerCase().includes(searchText) || player.name === input.value) &&
        (!selectedElsewhere.has(player.name) || player.name === input.value)
    ).slice(0, 12);

    results.replaceChildren();
    if (showResults && matches.length) {
        matches.forEach(player => {
            const option = document.createElement("button");
            option.className = "player-search-option";
            option.type = "button";
            option.setAttribute("role", "option");
            option.tabIndex = -1;
            const name = document.createElement("span");
            name.textContent = "#" + player.overallRank + " " + player.name;
            const meta = document.createElement("span");
            meta.className = "player-search-meta";
            meta.textContent = player.position + " · " + numberFormat.format(player.value);
            option.append(name, meta);
            option.addEventListener("pointerdown", event => event.preventDefault());
            option.addEventListener("click", () => {
                input.value = player.name;
                results.hidden = true;
                input.setAttribute("aria-expanded", "false");
                calculate();
                if (document.activeElement !== input) {
                    input.dataset.skipSuggestionFocus = "true";
                    input.focus();
                }
            });
            option.addEventListener("keydown", event => {
                const options = Array.from(results.querySelectorAll(".player-search-option"));
                const index = options.indexOf(option);
                if (event.key === "ArrowDown" && options[index + 1]) {
                    event.preventDefault();
                    options[index + 1].focus();
                } else if (event.key === "ArrowUp") {
                    event.preventDefault();
                    if (options[index - 1]) options[index - 1].focus();
                    else {
                        input.dataset.skipSuggestionFocus = "true";
                        input.focus();
                    }
                } else if (event.key === "Escape") {
                    results.hidden = true;
                    input.setAttribute("aria-expanded", "false");
                    input.dataset.skipSuggestionFocus = "true";
                    input.focus();
                }
            });
            results.appendChild(option);
        });
        results.hidden = false;
        input.setAttribute("aria-expanded", "true");
        input.dataset.activeOptionIndex = "-1";
    } else {
        if (showResults) {
            const empty = document.createElement("div");
            empty.className = "player-search-empty";
            empty.textContent = "No matching ranked players";
            results.appendChild(empty);
        }
        results.hidden = !showResults;
        input.setAttribute("aria-expanded", String(showResults));
    }
}

function setTheme(isDark, persist = false) {
    document.documentElement.dataset.theme = isDark ? "dark" : "light";
    document.querySelector('meta[name="theme-color"]').content = isDark ? "#111916" : "#f1f4ef";
    if (persist) {
        try {
            localStorage.setItem("fantasy-trade-theme", isDark ? "dark" : "light");
        } catch {}
    }
}

function refreshRankings() {
    const mode = document.getElementById("rankingMode").value;
    activePlayers = buildActivePlayers();
    document.getElementById("rankingSourceNote").textContent = rankingSnapshot.sourceNotes?.[mode] || (mode === "redraft"
        ? "FantasyPros 2026 rest-of-season Half-PPR consensus (Oct. 6). QB/TE ranks beyond consensus depth are ordered by Sleeper Weeks 1-4 PPR points per game. Consensus reflects expert health, team and schedule judgments; full injury history is unavailable."
        : "FantasyPros 2026 dynasty PPR consensus (Oct. 5). QB ranks beyond consensus depth use Weeks 1-4 PPR points per game with a modest age adjustment. Dynasty consensus reflects long-term age outlook; full injury history is unavailable.");
    document.querySelectorAll(".asset input.player-select").forEach(input => populatePlayerSelect(input, input.playerSearchResults));
}

function createPlayerRow(team) {
    const container = document.getElementById("team" + team);
    const entry = document.createElement("div");
    entry.className = "asset-entry";
    const row = document.createElement("div");
    row.className = "asset";

    const input = document.createElement("input");
    const results = document.createElement("div");
    results.id = "player-options-" + (++playerInputCounter);
    results.className = "player-search-results";
    results.setAttribute("role", "listbox");
    results.setAttribute("aria-label", "Ranked player suggestions");
    results.hidden = true;
    input.className = "player-select";
    input.type = "search";
    input.placeholder = "Search or choose player";
    input.autocomplete = "off";
    input.setAttribute("role", "combobox");
    input.setAttribute("aria-autocomplete", "list");
    input.setAttribute("aria-expanded", "false");
    input.setAttribute("aria-controls", results.id);
    input.setAttribute("aria-label", "Search players received by Team " + team);
    input.playerSearchResults = results;
    populatePlayerSelect(input, results);

    const value = document.createElement("output");
    value.className = "asset-value";
    value.textContent = "0";
    value.setAttribute("aria-label", "Player trade value");

    const remove = document.createElement("button");
    remove.className = "remove-player";
    remove.type = "button";
    remove.textContent = "Remove";
    remove.setAttribute("aria-label", "Remove player from Team " + team);
    remove.addEventListener("click", () => {
        entry.remove();
        calculate();
    });

    const statsPanel = document.createElement("details");
    statsPanel.className = "player-stats";
    statsPanel.hidden = true;
    const statsSummary = document.createElement("summary");
    statsSummary.textContent = "View 2026 season averages";
    const statsGrid = document.createElement("dl");
    statsGrid.className = "stats-grid";
    [
        ["games", "Games played"],
        ["fantasyPpg", "Fantasy PPG"],
        ["yardsPerGame", "Receiving YPG"],
        ["targetShare", "Target share"],
        ["routes", "Routes run (season)"],
        ["catchesPerGame", "Catches/game"],
        ["targetsPerGame", "Targets/game"],
        ["snaps", "Offensive snaps"],
        ["snapsPerGame", "Snaps/game"]
    ].forEach(([key, label]) => {
        const item = document.createElement("div");
        const term = document.createElement("dt");
        term.dataset.label = key;
        term.textContent = label;
        const description = document.createElement("dd");
        description.dataset.stat = key;
        item.append(term, description);
        statsGrid.appendChild(item);
    });
    const statsSource = document.createElement("p");
    statsSource.className = "stats-source";
    const sleeperLink = document.createElement("a");
    sleeperLink.href = "https://api.sleeper.app/v1/stats/nfl/regular/2026/4";
    sleeperLink.target = "_blank";
    sleeperLink.rel = "noopener noreferrer";
    sleeperLink.textContent = "Sleeper game logs";
    const routesLink = document.createElement("a");
    routesLink.href = "https://heatradar.app/nfl/routes";
    routesLink.target = "_blank";
    routesLink.rel = "noopener noreferrer";
    routesLink.textContent = "HeatRadar route totals";
    statsSource.append("Sleeper production, Weeks 1-4: ", sleeperLink, " · Routes through Week 3: ", routesLink, " · Retrieved Oct. 6, 2026.");
    statsPanel.append(statsSummary, statsGrid, statsSource);

    input.addEventListener("input", () => {
        populatePlayerSelect(input, results, true);
        calculate();
    });
    input.addEventListener("focus", () => {
        if (input.dataset.skipSuggestionFocus) {
            delete input.dataset.skipSuggestionFocus;
            return;
        }
        populatePlayerSelect(input, results, true);
    });
    input.addEventListener("blur", () => {
        results.hidden = true;
        input.setAttribute("aria-expanded", "false");
    });
    input.addEventListener("keydown", event => {
        if (event.key === "ArrowDown") {
            const firstOption = results.querySelector(".player-search-option");
            if (firstOption) {
                event.preventDefault();
                firstOption.focus();
            }
        } else if (event.key === "Escape") {
            results.hidden = true;
            input.setAttribute("aria-expanded", "false");
        }
    });
    row.append(input, value, remove);
    entry.append(row, results, statsPanel);
    container.appendChild(entry);
    calculate();
}

function updateProductionPanel(select) {
    const panel = select.closest(".asset-entry").querySelector(".player-stats");
    const stats = wrProduction[select.value];
    panel.hidden = !stats;
    if (!stats) return;

    const scoring = document.getElementById("scoring").value;
    const scoringLabels = { standard: "Standard", half: "Half PPR", ppr: "PPR" };
    const pointsKey = { standard: "standardPpg", half: "halfPprPpg", ppr: "pprPpg" }[scoring];
    const values = {
        games: stats.games,
        fantasyPpg: stats[pointsKey].toFixed(1),
        yardsPerGame: stats.yardsPerGame.toFixed(1),
        targetShare: stats.targetSharePct.toFixed(1) + "%",
        routes: numberFormat.format(wrRoutes[select.value]),
        catchesPerGame: stats.catchesPerGame.toFixed(1),
        targetsPerGame: stats.targetsPerGame.toFixed(1),
        snaps: numberFormat.format(stats.snaps),
        snapsPerGame: stats.snapsPerGame.toFixed(1)
    };

    Object.entries(values).forEach(([key, value]) => {
        panel.querySelector('[data-stat="' + key + '"]').textContent = value;
    });
    panel.querySelector('[data-label="fantasyPpg"]').textContent = "Fantasy PPG (" + scoringLabels[scoring] + ")";
}

function calculate() {
    const inputs = Array.from(document.querySelectorAll(".asset input.player-select"));
    const usedPlayers = new Set();

    inputs.forEach(input => {
        const name = input.value.trim();
        const isKnownPlayer = activePlayers.some(player => player.name === name) || Boolean(getSelectedPlayerPosition(name));
        const isDuplicate = isKnownPlayer && usedPlayers.has(name);
        const value = isDuplicate ? 0 : playerValue(name);
        if (isKnownPlayer && !isDuplicate) usedPlayers.add(name);
        input.setAttribute("aria-invalid", String(Boolean(name && (!isKnownPlayer || isDuplicate))));
        input.dataset.tradeValue = String(value);
        input.parentElement.querySelector(".asset-value").textContent = numberFormat.format(value);
        updateProductionPanel(input);
    });

    const totalA = Array.from(document.querySelectorAll("#teamA input.player-select"))
        .reduce((sum, input) => sum + Number(input.dataset.tradeValue || 0), 0);
    const totalB = Array.from(document.querySelectorAll("#teamB input.player-select"))
        .reduce((sum, input) => sum + Number(input.dataset.tradeValue || 0), 0);

    document.getElementById("totalA").textContent = numberFormat.format(totalA);
    document.getElementById("totalB").textContent = numberFormat.format(totalB);

    const result = document.getElementById("result");
    const winner = document.getElementById("winner");
    const differenceElement = document.getElementById("difference");
    const percentageElement = document.getElementById("percentage");
    const hasRankedPlayer = input => activePlayers.some(player => player.name === input.value) || Boolean(getSelectedPlayerPosition(input.value));
    const hasPlayersA = Array.from(document.querySelectorAll("#teamA input.player-select")).some(hasRankedPlayer);
    const hasPlayersB = Array.from(document.querySelectorAll("#teamB input.player-select")).some(hasRankedPlayer);

    result.classList.remove("is-even", "is-unbalanced", "is-pending");
    if (!hasPlayersA || !hasPlayersB) {
        result.classList.add("is-pending");
        winner.textContent = "Add at least one player to both sides to compare.";
        differenceElement.textContent = "0";
        percentageElement.textContent = "";
        return;
    }

    const difference = Math.abs(totalA - totalB);
    differenceElement.textContent = numberFormat.format(difference);
    percentageElement.textContent = (difference / Math.max(totalA, totalB) * 100).toFixed(1) + "% value gap";

    if (totalA === totalB) {
        result.classList.add("is-even");
        winner.textContent = "Even by the selected rankings and league settings.";
    } else if (totalA > totalB) {
        result.classList.add("is-unbalanced");
        winner.textContent = "Team A receives more calculated value.";
    } else {
        result.classList.add("is-unbalanced");
        winner.textContent = "Team B receives more calculated value.";
    }
}

document.querySelectorAll(".add-player").forEach(button => {
    button.addEventListener("click", () => createPlayerRow(button.dataset.team));
});
document.getElementById("scoring").addEventListener("change", () => {
    refreshRankings();
    calculate();
});
document.getElementById("superflex").addEventListener("change", () => {
    refreshRankings();
    calculate();
});
positionOrder.forEach(position => {
    document.getElementById(position.toLowerCase() + "Multiplier").addEventListener("input", () => {
        refreshRankings();
        calculate();
    });
});
document.getElementById("rankingMode").addEventListener("change", () => {
    refreshRankings();
    calculate();
});
const darkModeToggle = document.getElementById("darkMode");
darkModeToggle.checked = document.documentElement.dataset.theme === "dark";
darkModeToggle.addEventListener("change", () => {
    setTheme(darkModeToggle.checked, true);
});
setTheme(darkModeToggle.checked);
refreshRankings();
createPlayerRow("A");
createPlayerRow("B");
</script>
